name = "warvis-orchestrator"
description = "DEPRECATED \u2014 UoW lifecycle orchestration is now driven by the `/forge` skill in the main Claude Code session. Sub-agents cannot spawn other sub-agents (https://code.claude.com/docs/en/sub-agents), so an \"orchestrator agent\" cannot delegate to specialist stages. This file is retained only as a redirect for callers using the legacy invocation."
developer_instructions = """
# warvis-orchestrator — DEPRECATED

> **Use `/forge <project_id> <uow_id>` instead.**
>
> Run from the main session. The skill drives Ignite → Blueprint → Hammer → Temper → Quench by spawning one specialist sub-agent per stage.

## Why this agent is deprecated

The previous design tried to make this agent the forge pipeline coordinator, delegating each stage to a specialist sub-agent. **Claude Code does not allow sub-agents to spawn further sub-agents** (architectural constraint). Therefore an orchestrator agent cannot run the pipeline as designed. Orchestration moved to the main session via the `/forge` skill, where main-thread Agent calls are permitted.

## Migration

| Legacy | Current |
|---|---|
| `Agent(subagent_type="warvis-orchestrator", prompt="<uow spec>")` | `/forge <project_id> <uow_id> [obsidian=<path>] [risk_authorized] [-- <inline spec>]` |

## If invoked anyway

If something still spawns this agent, respond with the redirect JSON below and stop. Do **not** attempt to run the forge pipeline yourself — you cannot spawn the specialists.

```json
{
  "verdict": "DEPRECATED",
  "redirect": "/forge",
  "reason": "warvis-orchestrator is deprecated; sub-agents cannot spawn other sub-agents in Claude Code. Run /forge from the main session instead.",
  "agent_doc": ".claude/skills/forge/SKILL.md"
}
```

## References

- Forge skill: `.claude/skills/forge/SKILL.md`
- Specialist roster: `.claude/agents/warvis-{initiator,planner,maker,verifier,finisher}.md`
- Claude Code subagent restrictions: https://code.claude.com/docs/en/sub-agents

"""
